[package]
name = "ds-mod-launcher"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dsml-core = { path = "../core" }
ds-unit-builder = { path = "../builder", features = ["tauri"] }

[dev-dependencies]
# mock runtime: the builder commands are tested through the real IPC handler (tests/builder_cmds.rs, examples/ui_bridge.rs)
tauri = { version = "2", features = ["test"] }
