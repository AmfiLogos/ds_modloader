[package]
name = "ds-unit-builder"
version = "0.1.0"
edition = "2021"
description = "Unit Builder engine for the DS mod launcher: wiki builder stat sheet, share links, my units, PvP / Foreign Expedition export"

[lib]
name = "ds_unit_builder"
path = "src/lib.rs"

[features]
default = []
# Tauri 2 app commands for the UI (src/tauri_cmds.rs)
tauri = ["dep:tauri"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }
flate2 = "1"
tauri = { version = "2", optional = true }
# short wiki links (/t/<id>, /build/<id>): one GET, no redirects followed (same client as dsml-core)
ureq = "3"

[target.'cfg(unix)'.dependencies]
# the real home folder (getpwuid) for the shared units library
libc = "0.2"

